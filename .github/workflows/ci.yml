name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    name: Lint, type-check, and test
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install SUMO
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends sumo sumo-tools

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --dev

      - name: Ruff
        run: uv run ruff check .

      - name: Mypy
        run: uv run mypy common rl simulation

      - name: Pytest
        env:
          SUMO_HOME: /usr/share/sumo
        run: uv run pytest -q --basetemp=.pytest-tmp

  docker:
    name: Docker build smoke
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build app image
        run: docker build -f docker/app/Dockerfile -t smart-traffic-app:ci .

      - name: Build vision image
        run: docker build -f docker/vision/Dockerfile -t smart-traffic-vision:ci .

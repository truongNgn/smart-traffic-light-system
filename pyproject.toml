[project]
name = "smart-traffic-system"
version = "0.1.0"
description = "Real-time streaming smart traffic light control: YOLO vision + SUMO/TraCI + Deep Q-Network."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "structlog>=24.1",
    "traci>=1.19.0",
    "sumolib>=1.19.0",
    "gymnasium>=0.29",
    "numpy>=1.26",
    "torch>=2.2",
    "tqdm>=4.66",
    "torch==2.5.1+cu121",
    "torchvision==0.20.1+cu121",
    "ultralytics>=8.1",
    "opencv-python>=4.9",
    "redis>=5.0",
    "lapx>=0.5",
    "tensorrt>=11.1.0",
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
]
# ~8x faster than traci for step-heavy workloads (in-process, no socket) -
# training uses it by default (rl/train/config.py), falling back to traci
# if unavailable. Separate extra since it's headless-only.
fast-sim = [
    "libsumo>=1.19.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
packages = ["common", "rl", "simulation", "vision", "streaming"]

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch" }
torchvision = { index = "pytorch" }
torchaudio = { index = "pytorch" }
